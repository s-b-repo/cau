name: ci

# One workflow, six lanes. Every gate in this repository is already a make target
# in the Makefile; the workflow only decides which lane runs what, how long it
# may take and what gets published. The lanes share a checkout and a composite
# action, not a job: a red `test` can never mask a green `detection gates`, and
# every failure has a name a reviewer can assign instead of a line in one
# 20-minute log.

on:
  pull_request:
    # Documentation, wiki, packaging and completion-only changes cannot move any
    # gate in this workflow, so they get no runner time. main pushes and tags are
    # never path-filtered: they are the integration gate and the release trigger,
    # and a tag whose head commit is a docs change must still cut a release.
    paths-ignore:
      - "**.md"
      - "wiki/**"
      - "docs/**"
      - "completions/**"
      - "packaging/**"
      - "scripts/**"
      - "debian/**"
      - ".github/dependabot.yml"
      - ".github/workflows/wiki.yml"
      - ".github/workflows/package.yml"
  push:
    branches: [main]
    tags: ["v*"]
  # A CGO build against a moving runner image (Go, libyara, glibc) is the one
  # thing a push-only pipeline never exercises. The nightly run is the drift
  # canary, and nothing else needs the GH runner image to stay honest.
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is worthless; a run of main, or of a release tag, is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint, vet, vendor tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cau-env

      - name: gofmt and go vet
        run: make lint

      # Debian and Arch build offline out of the committed vendor/ tree
      # (debian/rules: GOPROXY=off), so a stale vendor/ breaks packaging rather
      # than this pipeline. Catch it here, where it costs seconds.
      - name: vendor/ matches go.mod
        run: |
          go mod vendor
          if ! git diff --exit-code -- vendor; then
            echo "::error::vendor/ is stale: run 'go mod vendor' and commit the result"
            exit 1
          fi

  test:
    name: unit tests (race)
    runs-on: ubuntu-latest
    # TestMeasureRealELF walks ~5k system files on an Ubuntu runner and the
    # Makefile gives the suite a 25-minute budget; the job has to be able to
    # reach that budget or a slow runner fails a green tree.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cau-env

      - name: Race tests over every package
        run: make test-race

  gates:
    name: detection gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cau-env

      - name: Build both binaries
        run: make build build-mcp

      - name: Rule lint
        run: make lint-rules

      - name: ATT&CK coverage gate and matrix
        run: |
          set -o pipefail
          make coverage | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Corpus validation and regression gate
        run: |
          set -o pipefail
          make eval | tee -a "$GITHUB_STEP_SUMMARY"

      # Published even when a gate above failed: the report is the evidence for
      # the failure, so a reviewer should never have to re-run the job to get it.
      - name: Publish the gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-and-coverage
          path: |
            eval-out/report.json
            eval-out/attack-navigator.json
            eval-out/attack-coverage.sarif

  selfscan:
    name: self-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The recipe docs/cli.md documents ("CI recipes") but never wired up: the
      # SARIF this project produces for other people lands in its own
      # code-scanning dashboard, so a rule or heuristic that starts firing on
      # the tree is a review item instead of an artifact nobody opens.
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cau-env

      - name: Build
        run: make build

      - name: Scan the repository with itself (SARIF and OCSF)
        run: |
          ./cau scan --dir . --format sarif --output cau.sarif --fail-on none --quiet
          ./cau scan --dir . --format ocsf --output cau.ocsf.json --fail-on none --quiet

      - name: Upload the SARIF to code scanning
        # The guard matters: if the scan step died there is no SARIF to upload,
        # and code scanning keeps the last good set rather than being wiped.
        if: always() && hashFiles('cau.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cau.sarif
          category: cau-self-scan

      - name: Publish the self-scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-scan
          path: |
            cau.sarif
            cau.ocsf.json

  fuzz:
    name: fuzz the untrusted-input parsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cau-env

      - name: Build
        run: make build

      # A smoke hunt, not a campaign. Every seed corpus already runs as a unit
      # test in the race lane, so the value here is coverage-guided mutation on
      # top of them: 30s per target catches a freshly-introduced nil deref, and
      # a crasher it finds is exactly the "commit the seed, fix before merge"
      # case docs/contributing.md describes.
      - name: Coverage-guided hunt over every Fuzz* target
        run: make fuzz FUZZTIME=30s

      - name: Publish the crasher it found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: |
            **/testdata/fuzz/**

  release:
    name: build and sign release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, gates, selfscan, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Hex-encoded Ed25519 signing key (seed or full). Set this repository
      # secret to produce signed releases; without it the release is published
      # unsigned (and `cau verify-self` / `cau update` have nothing to trust).
      CAU_RELEASE_SIGNING_KEY: ${{ secrets.CAU_RELEASE_SIGNING_KEY }}
      # The matching Ed25519 public key (hex), a repository variable or secret.
      # Published as a release asset and used to self-verify before publishing.
      CAU_RELEASE_PUBLIC_KEY: ${{ vars.CAU_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/cau-env

      - name: Build the release tarballs
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          make build VERSION="$tag"
          # cau-mcp ships with every package (Debian, Arch, make install) and was
          # the only artifact the release job never built.
          make build-mcp VERSION="$tag"
          mkdir -p dist
          for art in cau cau-mcp; do
            cp "$art" "dist/${art}-${tag}-linux-amd64"
            tar -czf "dist/${art}-${tag}-linux-amd64.tar.gz" "$art" rules signatures LICENSE README.md
          done
          # The source tarball, and why it is built here rather than linked.
          # GitHub's /archive/ tarballs are generated per request and are not
          # byte-stable, so a sha256 recorded from one fetch does not match the
          # bytes a packager downloads next (this is what broke the Arch build:
          # makepkg's source validation failed on a URL the tree had not
          # changed). This asset is fixed bytes, so the PKGBUILD, the Debian
          # orig tarball and `uscan` can all pin it.
          #
          # Determinism is built in three steps, and all three are load-bearing:
          #   1. What is excluded is chosen by pathspec, not by
          #      .gitattributes export-ignore. export-ignore looks right and is
          #      the wrong tool: GitHub's codeload archive — which
          #      actions/checkout downloads instead of cloning — applies it, so
          #      marking debian/ export-ignore silently deleted debian/,
          #      packaging/ and .github/ from every CI checkout and three jobs
          #      died on a missing debian/changelog.
          #      What comes out: packaging/arch/ (the PKGBUILD that hashes this
          #      tarball, so it cannot be inside it), debian/ and .github/.
          #      What stays: packaging/systemd/, because the PKGBUILD installs
          #      the units out of the source tree, and excluding the whole
          #      tree breaks `make install-systemd` for Arch users.
          #   2. tar restamps every member to a FIXED epoch. Using the tag's
          #      commit date here would look natural and would be wrong: it
          #      makes the bytes change on every new commit, and the recorded
          #      checksum would only match the tree at the instant it was
          #      taken. A constant makes the checksum a function of content
          #      alone, which is what a packager needs to pin.
          #   3. --sort=name, owner/group 0 and gzip -n remove the remaining
          #      per-run variation (name order, usernames, gzip timestamp).
          # Verified locally: two runs produce one checksum, and the checksum is
          # unchanged by a commit that only touches packaging/.
          SOURCE_DATE_EPOCH=1735689600
          v=${tag#v}
          stage=$(mktemp -d)
          git archive --format=tar --prefix="cau-${v}/" "$tag" -- . \
            ':(exclude)packaging/arch' ':(exclude)debian' ':(exclude).github' |
            tar -x -C "$stage"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
            --numeric-owner --format=gnu -C "$stage" -cf - "cau-${v}" |
            gzip -9n > "dist/cau-${v}.tar.gz"
          rm -rf "$stage"
          ls -l dist

      - name: Sign the update bundle, the integrity baseline and the checksums
        run: |
          set -euo pipefail
          if [ -z "$CAU_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::CAU_RELEASE_SIGNING_KEY is not set; publishing an UNSIGNED release"
            (cd dist && sha256sum * > SHA256SUMS)
            exit 0
          fi
          # Write the key to a private temp file, sign, then shred it.
          umask 077
          KEYFILE="$(mktemp)"
          printf '%s' "$CAU_RELEASE_SIGNING_KEY" > "$KEYFILE"
          trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT
          tag="${GITHUB_REF_NAME}"

          # 1) Signed signature-DB bundle, for `cau update`.
          ./cau bundle update --db signatures/hashes.txt --sign-key "$KEYFILE" \
            --out dist --db-version "$tag" --min-engine "${tag#v}"

          # 2) Signed detection-content integrity baseline (`cau selftest`).
          ./cau selftest --record --sign-key "$KEYFILE" --manifest dist/integrity.json

          # 3) The pinned public key, so `cau verify-self` has something to check
          #    against on a machine that holds no repository secret.
          if [ -n "$CAU_RELEASE_PUBLIC_KEY" ]; then
            printf '%s' "$CAU_RELEASE_PUBLIC_KEY" > dist/release-pubkey.hex
          else
            echo "::warning::CAU_RELEASE_PUBLIC_KEY is not set; the release will not self-verify before publishing"
          fi

          # 4) Signed SHA256SUMS over everything now in dist/ — the tarballs,
          #    both binaries, the bundle and the integrity manifest. Order is the
          #    contract: a file staged after this line ships unsigned, which is
          #    how the integrity manifest and the public key used to ship.
          #    The binary thereby references itself: its own hash is in a file it
          #    can fetch and verify against the pinned key.
          ./cau bundle checksums --sign-key "$KEYFILE" --out dist \
            $(find dist -maxdepth 1 -type f ! -name 'SHA256SUMS*')

      - name: Verify the signed artifacts before publishing
        if: env.CAU_RELEASE_SIGNING_KEY != '' && env.CAU_RELEASE_PUBLIC_KEY != ''
        run: |
          # A release that cannot verify itself must not ship: the built binary
          # computes its own SHA-256 and checks it against the signed
          # SHA256SUMS above, signature before hash.
          ./cau verify-self --from dist --pubkey dist/release-pubkey.hex \
            --name "cau-${GITHUB_REF_NAME}-linux-amd64"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # v1.2.0-rc1 ships as a pre-release; v1.2.0 does not.
          prerelease: ${{ contains(github.ref_name, '-') }}
