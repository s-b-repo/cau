name: package

# The packaging proof: every distro package this project claims to support is
# actually built here, installed into a clean container, and driven with a scan.
# A package that builds but cannot detect is a regression, so the smoke test
# asserts the verdicts, not just the exit codes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # The allow list omitted main.go, scripts/package-smoke.sh, docs/packaging.md
    # and every file a new contributor adds at the top level, so those changes
    # silently skipped the packaging gate.
    paths-ignore:
      - "**.md"
      - "wiki/**"
      - ".github/dependabot.yml"
      - ".github/workflows/wiki.yml"
  # Re-run the packaging proof by hand after a container image or a toolchain
  # change: the three legs pin nothing but `latest`, so an upstream image move
  # has to be provable without waiting for the next tag.
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"

# Only read the repository: nothing here publishes to a release. The release
# job in ci.yml downloads these artifacts and publishes the packages itself,
# so their bytes are staged before its SHA256SUMS is signed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is worthless; a run of main, or of a release tag, is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debian:
    name: Debian (.deb, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both architectures, natively: the cgo binding to libyara is built, not
        # cross-compiled, so the arm64 package is the one an arm64 user gets.
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The Makefile derives the version from `git describe`, so a shallow checkout
        # silently stamps every package with a commit sha instead of the tag, and
        # scripts/package-smoke.sh only asserts the version is not `dev`, so the
        # mistake is invisible. The PKGBUILD stamps the same way.
        with:
          fetch-depth: 0

      - name: Install the build toolchain
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential debhelper pkg-config golang-go libyara-dev \
            curl ca-certificates
          echo "golang: $(go version)"
          echo "libyara: $(pkg-config --modversion yara)"

      # The CHANGELOG claim, made true: the Debian source package is proven to
      # build on every non-tag, non-PR run. A tag build proves it below (it
      # runs the full source+binary build), and a PR is a preview of a merge,
      # so the proof is spent where the claim would otherwise be unexercised.
      #
      # It runs from a copy: the proof must not dirty the tree the binary build
      # reads, and dpkg-source -b folds anything loose (a stray binary, a scan
      # report, a nested repo's .git) into the orig tarball or aborts on it, so
      # the copy carries only what a packager would publish.
      - name: Prove the Debian source package builds (from a copy of the tree)
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v') }}
        # Bounded, and failing the job: without a cap a wedged dpkg-source holds
        # the whole packaging gate, and without set -eu a broken source package
        # would look like a pass.
        timeout-minutes: 10
        run: |
          set -eu
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/cau"
          # The exclusions below are about what belongs in the tarball: the
          # tree's own .gitignore build products, the nested cau-kernel repo,
          # and the untracked local WIP paths.
          tar -C "$GITHUB_WORKSPACE" \
            --exclude=./.git \
            --exclude=./dist \
            --exclude=./eval-out \
            --exclude=./cau --exclude=./cau-mcp \
            --exclude=./cau-kernel \
            --exclude=./scripts/lintworkflows \
            --exclude=./docs/p.p \
            --exclude=./cau.sarif --exclude=./cau.ocsf.json \
            --exclude=./aptrepo \
            --exclude='*.deb' --exclude='*.udeb' \
            --exclude='*.dsc' --exclude='*.debian.tar.*' \
            --exclude='*.build' --exclude='*.buildinfo' --exclude='*.changes' \
            -cf - . | tar -xf - -C "$stage/cau"
          cd "$stage/cau"
          # A 3.0 (quilt) source build needs the upstream tarball to exist:
          # dpkg-source does not generate it, it diffs the tree against it and
          # aborts if the two differ. A tag fetches the tarball from the
          # release; a branch has no release, so it is built from the tree
          # that is about to be packaged, minus debian/, which is what
          # "upstream" means in this format. The same tree on both sides is
          # what makes the diff come out clean.
          upver=$(dpkg-parsechangelog -SVersion | sed 's/-[^-]*$//')
          tar -C "$stage/cau" --exclude=./debian \
            --transform "s|^\./|cau-${upver}/|" \
            -czf "$stage/cau_${upver}.orig.tar.gz" .
          dpkg-buildpackage -us -uc -S
          ls -l "$stage"

      - name: Build the source and binary packages
        run: |
          set -eu
          # The upstream version is the changelog version without the Debian
          # revision, the same derivation debian/rules stamps into the binary.
          upver=$(dpkg-parsechangelog -SVersion | sed 's/-[^-]*$//')
          if [ "v${upver}" = "${GITHUB_REF_NAME:-}" ]; then
            # From a release tag the tree IS the upstream tarball, so build the
            # source package too: a 3.0 (quilt) source build needs the upstream
            # tarball that `uscan` fetches from the tag debian/watch describes,
            # and a .tar.gz from GitHub is accepted (the format matches the
            # name).
            curl -fsSL -o "../cau_${upver}.orig.tar.gz" \
              "https://github.com/s-b-repo/cau/archive/refs/tags/v${upver}.tar.gz"
            dpkg-buildpackage -us -uc        # source + binary, unsigned
          else
            # On a branch the tree has moved past the tag, and dpkg-source
            # would abort with "unexpected upstream changes". The binary
            # package, which is what ships to users, builds from the tree.
            dpkg-buildpackage -us -uc -b
          fi
          mkdir -p dist
          # Collect what dpkg-buildpackage produced: a binary-only run makes no
          # .dsc and no .debian.tar, so each artefact is moved only when it
          # exists rather than letting an unmatched glob abort the job.
          for f in ../cau_*.deb ../cau_*.udeb ../cau_*.dsc ../cau_*.debian.tar.* \
                   ../cau_*.buildinfo ../cau_*.changes; do
            if [ -e "$f" ]; then mv "$f" dist/; fi
          done
          ls -l dist/

      - name: Install the package
        run: |
          # The .deb filename carries the architecture the builder produced,
          # which is the runner's own (the cgo binding to libyara is built, not
          # cross-compiled). Ask dpkg instead of assuming amd64: an arm64 leg
          # that globbed the amd64 name installed nothing and smoke-tested air.
          arch=$(dpkg --print-architecture)
          apt-get install -y --no-install-recommends ./dist/cau_*_"${arch}".deb

      - name: Smoke test the installed package
        run: scripts/package-smoke.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cau-debian-trixie-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      # The release is not published from here. The release job in ci.yml
      # downloads this artifact and publishes the package itself, so the digest
      # lands in the release's signed SHA256SUMS — a package attached to the
      # release after that manifest was signed shipped with no authenticated
      # digest. That job fails the release when a leg is missing, which is the
      # guarantee this step's fail_on_unmatched_files used to give.

  kali:
    name: Kali Linux (.deb, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    timeout-minutes: 30
    container:
      image: kalilinux/kali-rolling:latest
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The Makefile derives the version from `git describe`, so a shallow checkout
        # silently stamps every package with a commit sha instead of the tag, and
        # scripts/package-smoke.sh only asserts the version is not `dev`, so the
        # mistake is invisible. The PKGBUILD stamps the same way.
        with:
          fetch-depth: 0

      - name: Install the build toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # kali.org's mirrors return a 500 now and then, which fails the whole
          # job rather than one download. apt's own retry option plus an outer
          # retry of the index covers both the transient and the persistent case.
          set -eu
          installed=0
          for attempt in 1 2 3 4 5; do
            if apt-get -o Acquire::Retries=5 update -qq &&
               apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                 build-essential debhelper pkg-config golang-go libyara-dev; then
              installed=1
              break
            fi
            echo "apt attempt $attempt failed, retrying" >&2
            sleep 15
          done
          [ "$installed" -eq 1 ] || exit 1
          go version
          pkg-config --modversion yara

      - name: Build the binary package
        run: |
          set -eu
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          for f in ../cau_*.deb ../cau_*.build ../cau_*.buildinfo ../cau_*.changes; do
            if [ -e "$f" ]; then mv "$f" dist/; fi
          done
          ls -l dist/

      - name: Install the package
        run: |
          # Same derivation as the Debian leg: the arch in the .deb filename is
          # the runner's, so read it from dpkg rather than assuming amd64.
          arch=$(dpkg --print-architecture)
          apt-get install -y --no-install-recommends ./dist/cau_*_"${arch}".deb

      - name: Smoke test the installed package
        run: scripts/package-smoke.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cau-kali-rolling-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      # The release is not published from here: the release job in ci.yml
      # downloads this artifact and publishes the .deb itself, so its digest
      # lands in the release's signed SHA256SUMS (a package attached after that
      # manifest was signed shipped with no authenticated digest). That job
      # fails the release when a leg is missing, the guarantee this step's
      # fail_on_unmatched_files used to give.

  arch:
    name: Arch Linux (.pkg.tar.zst, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest, image: 'archlinux:latest'}
          # The official Arch image is x86_64-only. Arch Linux ARM needs its
          # native rootfs as well as a native runner; emulation masks this bug.
          - {arch: arm64, runner: ubuntu-24.04-arm, image: 'menci/archlinuxarm:latest'}
    timeout-minutes: 30
    container: ${{ matrix.image }}
    steps:
      # The toolchain before the checkout, not after it. The checkout needs git
      # to make a real clone: without it the action falls back to downloading
      # the tree through the REST API and leaves no repository behind — and the
      # source archive below, which is made with `git archive`, then has
      # nothing to archive. The container's default user is root, so the
      # checkout's safe.directory setting is what lets the clone proceed.
      - name: Install the build toolchain
        run: |
          set -eu
          # Refresh and upgrade together: a partial upgrade can leave the Go
          # toolchain or libyara linked against libraries absent in the image.
          # The downloader's sandbox is off: it switches to an unprivileged
          # user and applies Landlock, and neither works in every container
          # (the arm64 image has neither the alpm user nor kernel Landlock),
          # so pacman fails before it installs anything.
          pacman --disable-sandbox -Syu --noconfirm --needed --noprogressbar \
            base-devel go pkgconf yara sudo git
          go version
          pkg-config --modversion yara
          # makepkg refuses to run as root, and the container's default user is
          # root. The build below builds as this user; so does the metadata
          # check, or it fails on the image's default user rather than on the
          # recipe.
          useradd -m builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The Makefile derives the version from `git describe`, so a shallow checkout
        # silently stamps every package with a commit sha instead of the tag, and
        # scripts/package-smoke.sh only asserts the version is not `dev`, so the
        # mistake is invisible. The PKGBUILD stamps the same way.
        with:
          fetch-depth: 0

      - name: Check the AUR metadata
        run: |
          set -euo pipefail
          # makepkg also insists on a writable build directory, and the
          # checkout is not writable by the unprivileged user, so the recipe is
          # copied to a directory that is.
          work="$RUNNER_TEMP/aur-metadata"
          rm -rf "$work"
          mkdir -p "$work"
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO "$work/"
          chown -R builder "$work"
          cd "$work"
          sudo -u builder makepkg --printsrcinfo | tee "$work/cau.SRCINFO"
          diff -u .SRCINFO "$work/cau.SRCINFO"

      - name: Build the package as the unprivileged builder
        run: |
          set -eu
          # The checkout put the workspace in a temporary global git config
          # that only its own step sees, so this step's git does not trust the
          # directory it is about to archive: "detected dubious ownership".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Build the commit under review, rather than downloading the last
          # release. This also breaks the tag-release dependency cycle: release
          # publishing waits for these packages before the source asset exists.
          builddir="$RUNNER_TEMP/cau-arch-build"
          mkdir -p "$builddir"
          cp packaging/arch/PKGBUILD "$builddir/"
          pkgver=$(bash -c '. "$1"; printf "%s" "$pkgver"' -- packaging/arch/PKGBUILD)
          archive="cau-${pkgver}.tar.gz"
          scripts/source-archive.sh "$pkgver" "$builddir/$archive"
          checksum=$(sha256sum "$builddir/$archive" | cut -d ' ' -f 1)
          # Only this disposable recipe changes. The AUR recipe retains its
          # published release URL and pinned checksum.
          printf '\nsource=("%s")\nsha256sums=("%s")\n' "$archive" "$checksum" >> "$builddir/PKGBUILD"
          chown -R builder "$builddir"
          cd "$builddir"
          sudo -u builder makepkg --noconfirm
          # makepkg writes the package into its output directory, and the two
          # images do not agree about where that is. The package is found
          # rather than globbed: an empty glob is a silent success, and a
          # release that stages no Arch package ships none.
          packages=$(find "$builddir" -maxdepth 3 \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' \) | sort)
          if [ -z "$packages" ]; then
            echo "::error::no Arch package was built in $builddir"
            ls -la "$builddir"
            find / -maxdepth 6 -name '*.pkg.tar.zst' 2>/dev/null | head -5
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # shellcheck disable=SC2086
          cp $packages "$GITHUB_WORKSPACE/dist/"
          ls -l "$GITHUB_WORKSPACE/dist/"

      - name: Install the package
        run: pacman -U --noconfirm "$GITHUB_WORKSPACE"/dist/*.pkg.tar.zst

      - name: Smoke test the installed package
        run: scripts/package-smoke.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cau-archlinux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      # The release is not published from here: the release job in ci.yml
      # downloads this artifact and publishes the package itself, so its digest
      # lands in the release's signed SHA256SUMS (a package attached after that
      # manifest was signed shipped with no authenticated digest). That job
      # fails the release when a leg is missing, the guarantee this step's
      # fail_on_unmatched_files used to give.
