name: wiki

# Publishes the Markdown in wiki/ to the GitHub wiki whenever those pages (or
# this workflow) change on main. The wiki is a separate git repo
# (<repo>.wiki.git); it must be enabled and initialized once (create any page in
# the web UI) before the first push can succeed. The job is bounded by a
# timeout because it clones and pushes a whole second repository, so a hung git
# must not hold the wiki concurrency slot open.
on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync wiki/ to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wikidir="$(mktemp -d)"
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$repo" "$wikidir" 2>/dev/null; then
            echo "::warning::Could not clone the wiki repo. Enable the wiki and create one page in the web UI, then re-run."
            exit 0
          fi
          # Replace the wiki's tracked Markdown with wiki/, preserving .git.
          find "$wikidir" -maxdepth 1 -name '*.md' -delete
          cp wiki/*.md "$wikidir"/
          cd "$wikidir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs: sync wiki from wiki/ @ ${GITHUB_SHA::7}"
          git push
